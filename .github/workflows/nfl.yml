name: NFL props

on:
  schedule:
    # All times UTC. Odd minutes on purpose: GitHub delays/drops jobs at the top of the hour.
    - cron: "17 19 * * 4"   # Thu ~3pm ET  - before Thursday night game
    - cron: "43 20 * * 5"   # Fri ~4:45pm ET - after final injury reports
    - cron: "17 15 * * 0"   # Sun ~11:15am ET - before the 1pm games
    - cron: "41 18 * * 0"   # Sun ~2:40pm ET - before late games / Sunday night
    - cron: "23 20 * * 1"   # Mon ~4:25pm ET - before Monday night
    - cron: "37 15 * * 2"   # Tue ~11:40am ET - score the finished week
    - cron: "13 13 * * 3"   # Wed ~9:15am ET - score again (safe to repeat)
    # Closing-line snapshots (ParlayAPI, ~3 credits each), ~30-45 min before each kickoff window
    - cron: "27 23 * * 4"   # Thu ~7:30pm ET - before Thursday night kickoff
    - cron: "19 16 * * 0"   # Sun ~12:20pm ET - before the 1pm games
    - cron: "26 19 * * 0"   # Sun ~3:25pm ET - before the 4pm games
    - cron: "33 23 * * 0"   # Sun ~7:35pm ET - before Sunday night
    - cron: "29 23 * * 1"   # Mon ~7:30pm ET - before Monday night
    - cron: "52 12 * * 0"   # Sun ~8:50am ET - before 9:30am London-type games (skips if none)
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [project, rushing, score, closing, closing_early, ab, ab_features, parlay_test]
        default: project

permissions:
  contents: write

concurrency:
  group: nfl-props
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NFL_OUTPUT_DIR: data
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      PARLAY_TEST_CLOSING_DATE: ${{ vars.PARLAY_TEST_CLOSING_DATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick task
        id: task
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 15 * * 2" ] || [ "${{ github.event.schedule }}" = "13 13 * * 3" ]; then
            echo "name=score" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "27 23 * * 4" ] || [ "${{ github.event.schedule }}" = "19 16 * * 0" ] || [ "${{ github.event.schedule }}" = "26 19 * * 0" ] || [ "${{ github.event.schedule }}" = "33 23 * * 0" ] || [ "${{ github.event.schedule }}" = "29 23 * * 1" ]; then
            echo "name=closing" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "52 12 * * 0" ]; then
            echo "name=closing_early" >> "$GITHUB_OUTPUT"
          else
            echo "name=project" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        shell: bash
        run: |
          mkdir -p data
          rm -f data/email_latest.html data/email_subject.txt data/rushing_email_part.html
          case "${{ steps.task.outputs.name }}" in
            score) SCRIPT=score_week.py ;;
            ab) SCRIPT=ab_opponent.py ;;
            ab_features) SCRIPT=ab_features.py ;;
            parlay_test) SCRIPT=parlay_test.py ;;
            closing) SCRIPT=closing_snapshot.py ;;
            closing_early) export EARLY_GATE=1; SCRIPT=closing_snapshot.py ;;
            rushing) SCRIPT=rushing.py ;;
            *) SCRIPT=projections.py ;;
          esac
          if [ "${{ steps.task.outputs.name }}" = "project" ]; then
            # rushing first (it writes an email section); a failure there must not block projections
            python -u rushing.py 2>&1 | tee run.log || echo "Rushing model failed; continuing with receiving projections."
            python -u projections.py 2>&1 | tee -a run.log
          else
            python -u "$SCRIPT" 2>&1 | tee run.log
          fi

      - name: Show results in the run summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ steps.task.outputs.name }}"
            echo '```'
            tail -n 70 run.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email results
        if: success() && !startsWith(steps.task.outputs.name, 'closing')
        continue-on-error: true
        shell: bash
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          TASK="${{ steps.task.outputs.name }}"
          if [ "$TASK" = "project" ]; then
            if [ -f data/email_latest.html ]; then
              ATT=""
              for f in data/projections_*_latest.csv data/projections_*_edges_latest.csv data/rushing_*_latest.csv; do
                [ -f "$f" ] && ATT="$ATT $f"
              done
              python send_email.py --subject "$(cat data/email_subject.txt)" --html data/email_latest.html --attach $ATT
            else
              echo "No email summary was produced (offseason or no games); nothing to send."
            fi
          else
            python send_email.py --subject "NFL props: $TASK results" --text run.log --tail 120
          fi

      - name: Save results to the repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new files to save"
          else
            git commit -m "data: ${{ steps.task.outputs.name }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi



